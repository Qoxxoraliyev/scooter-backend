version: '3.8'

services:
  app:
    build: .
    container_name: scooter-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/scooter_backend
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1984

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      JWT_SECRET: veryveryveryveryveryverysecuresecretkey123456

  db:
    image: postgres:15
    container_name: scooter-db
    restart: always
    environment:
      POSTGRES_DB: scooter_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1984
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: scooter-redis
    ports:
      - "6379:6379"
server.port=8080

spring.application.name=scooter-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.expiration=86400000
jwt.secret=veryveryveryveryveryverysecuresecretkey123456

# optional
yandex.api.key=${YANDEX_API_KEY}

 spring.redis.host=${SPRING_REDIS_HOST}
 spring.redis.port=${SPRING_REDIS_PORT}
 spring.redis.password=${SPRING_REDIS_PASSWORD}